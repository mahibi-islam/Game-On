{% extends "base.html" %}

{% block title %}Forgot Password - GAME ON{% endblock %}

{% block content %}
<section class="container" style="max-width:600px; padding:2rem 1rem;">
    <h2 style="margin-bottom:1rem;">Forgot Password</h2>
    <p style="margin-bottom: 1.5rem; color: #666;">Enter your registered email address and we'll send you a link to
        reset your password.</p>

    <form method="post" class="form">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div style="margin-top:1rem; display:flex; gap:.5rem; align-items: center;">
            <button type="submit" class="btn btn-primary">Send Reset Link</button>
            <a href="{{ url_for('auth.login') }}" style="font-size: 0.9rem;">Back to Login</a>
        </div>
    </form>
</section>
{% endblock %}
