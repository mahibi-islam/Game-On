{% extends "base.html" %}

{% block title %}Reset Password - GAME ON{% endblock %}

{% block content %}
<section class="container" style="max-width:600px; padding:2rem 1rem;">
    <h2 style="margin-bottom:1rem;">Reset Password</h2>
    <p style="margin-bottom: 1.5rem; color: #666;">Enter a new password for your account.</p>

    <form method="post" class="form">
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters"
                required minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                placeholder="Repeat your new password" required minlength="6">
        </div>
        <div style="margin-top:1rem;">
            <button type="submit" class="btn btn-primary">Reset Password</button>
        </div>
    </form>
</section>
{% endblock %}
