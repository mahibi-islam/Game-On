{% extends "base.html" %}

{% block title %}Sign Up - GAME ON BOGURA{% endblock %}

{% block content %}
<section class="container" style="max-width:700px; padding:2rem 1rem;">
    <h2 style="margin-bottom:1rem;">Create your account</h2>
    <form method="post" class="form">
        <div class="grid" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" class="form-control">
            </div>
            <div class="form-group">
                <label for="nid">NID (optional)</label>
                <input type="text" id="nid" name="nid" class="form-control">
            </div>
            <div class="form-group" style="grid-column:1 / -1;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
        </div>
        <div style="margin-top:1rem; display:flex; gap:.5rem;">
            <button type="submit" class="btn btn-primary">Create Account</button>
            <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Already have an account?</a>
        </div>
    </form>
</section>
{% endblock %}
