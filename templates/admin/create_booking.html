{% extends "admin/base.html" %}

{% block page_title %}Create Manual Booking{% endblock %}

{% block content %}
<div class="admin-form-container">
    <h2>Create Manual Booking</h2>
    <form method="POST" class="admin-form">
        <div class="form-group">
            <label for="location_id">Select Location Venue *</label>
            {% if is_branch_admin and locations %}
            <input type="hidden" id="location_id" name="location_id" value="{{ locations[0]._id }}">
            <div style="font-weight: bold; background: rgba(46, 204, 113, 0.15); color: #2ecc71; padding: 10px 14px; border-radius: 5px; border: 1px solid #2ecc71; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-map-marker-alt"></i> {{ locations[0].name }} (Assigned Venue)
            </div>
            {% else %}
            <select id="location_id" name="location_id" class="form-control" onchange="filterSlotsByLocation(this.value)" required>
                <option value="">Select Location</option>
                {% for loc in locations %}
                <option value="{{ loc._id }}">{{ loc.name }}</option>
                {% endfor %}
            </select>
            {% endif %}
        </div>

        <div class="form-group">
            <label>Select Sport *</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button type="button" class="filter-tab active" onclick="selectSport('Football')" id="sport-btn-football" style="flex: 1; padding: 10px; font-weight: bold; border: 1px solid var(--border-color); text-align: center; cursor: pointer; border-radius: 5px;">
                    <i class="fas fa-futbol"></i> Football
                </button>
                <button type="button" class="filter-tab" onclick="selectSport('Badminton')" id="sport-btn-badminton" style="flex: 1; padding: 10px; font-weight: bold; border: 1px solid var(--border-color); text-align: center; cursor: pointer; border-radius: 5px;">
                    <i class="fas fa-table-tennis"></i> Badminton
                </button>
            </div>
            <input type="hidden" id="selected_sport" name="sport" value="Football">
        </div>

        <div class="form-group">
            <label for="date">Date * <span id="rate-type-badge" style="margin-left: 10px; font-size: 0.85em; padding: 3px 10px; border-radius: 4px; font-weight: bold; display: none;"></span></label>
            <input type="date" id="date" name="date" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="time_slot">Time Slot *</label>
            <select id="time_slot" name="time_slot" class="form-control" required>
                <option value="">Select Location first</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone *</label>
            <input type="tel" id="phone" name="phone" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="team_name">Team Name</label>
            <input type="text" id="team_name" name="team_name" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="payment_method">Payment Method *</label>
            <select id="payment_method" name="payment_method" class="form-control" required>
                <option value="">Select Payment Method</option>
                <option value="Cash">Cash</option>
                <option value="bKash">bKash</option>
                <option value="Nagad">Nagad</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="transaction_id">Transaction ID</label>
            <input type="text" id="transaction_id" name="transaction_id" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" class="form-control" rows="3"></textarea>
        </div>
        
        <div class="form-actions">
            <a href="{{ url_for('admin.bookings') }}" class="btn btn-secondary" style="text-decoration: none; padding: 10px 20px; display: inline-block;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="padding: 10px 20px;">Create Booking</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Master list of all enabled slots injected from backend
    const allSlots = [
        {% for slot in slots %}
        {
            id: "{{ slot._id }}",
            time: "{{ slot.time }}",
            price: "{{ slot.price }}",
            sport: "{{ slot.sport|title }}",
            rateType: "{{ slot.rate_type|default('weekday') }}",
            locationId: "{{ slot.location_id }}"
        },
        {% endfor %}
    ];
    
    // Minimum date is today
    document.getElementById('date').min = new Date().toISOString().split('T')[0];
    document.getElementById('date').addEventListener('change', function() {
        const locId = document.getElementById('location_id').value;
        filterSlots(locId, currentSport);
    });

    let currentSport = 'Football';

    function getRateTypeForDate(dateStr) {
        if (!dateStr) return null;
        const parts = dateStr.split('-');
        if (parts.length === 3) {
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            const dateObj = new Date(year, month, day);
            const dayOfWeek = dateObj.getDay(); // 0: Sun, 1: Mon, 2: Tue, 3: Wed, 4: Thu, 5: Fri, 6: Sat
            return (dayOfWeek === 5 || dayOfWeek === 6) ? 'weekend' : 'weekday';
        }
        return 'weekday';
    }

    function updateRateTypeBadge(rateType) {
        const badge = document.getElementById('rate-type-badge');
        if (!rateType) {
            badge.style.display = 'none';
            return;
        }
        badge.style.display = 'inline-block';
        if (rateType === 'weekend') {
            badge.style.backgroundColor = '#e74c3c';
            badge.style.color = '#ffffff';
            badge.innerHTML = '<i class="fas fa-calendar-week"></i> Weekend Rates';
        } else {
            badge.style.backgroundColor = '#2ecc71';
            badge.style.color = '#ffffff';
            badge.innerHTML = '<i class="fas fa-calendar-day"></i> Normal Day Rates';
        }
    }

    function selectSport(sport) {
        currentSport = sport;
        document.getElementById('selected_sport').value = sport;
        
        const footballBtn = document.getElementById('sport-btn-football');
        const badmintonBtn = document.getElementById('sport-btn-badminton');
        
        if (sport === 'Football') {
            footballBtn.classList.add('active');
            badmintonBtn.classList.remove('active');
        } else {
            badmintonBtn.classList.add('active');
            footballBtn.classList.remove('active');
        }
        
        const locId = document.getElementById('location_id').value;
        filterSlots(locId, currentSport);
    }

    function filterSlotsByLocation(locId) {
        filterSlots(locId, currentSport);
    }

    function filterSlots(locId, sport) {
        const slotSelect = document.getElementById('time_slot');
        slotSelect.innerHTML = '<option value="">Select Time Slot</option>';
        
        if (!locId) {
            slotSelect.innerHTML = '<option value="">Select Location first</option>';
            updateRateTypeBadge(null);
            return;
        }
        
        const selectedDate = document.getElementById('date').value;
        const rateType = getRateTypeForDate(selectedDate);
        updateRateTypeBadge(rateType);

        let filtered = allSlots.filter(s => s.locationId === locId && s.sport.toLowerCase() === sport.toLowerCase());
        if (rateType) {
            filtered = filtered.filter(s => (s.rateType || 'weekday') === rateType);
        }
        
        if (filtered.length === 0) {
            const label = rateType ? (rateType === 'weekend' ? 'Weekend' : 'Normal Day') : '';
            slotSelect.innerHTML = `<option value="">No ${label} ${sport} slots configured for this location</option>`;
            return;
        }

        if (selectedDate) {
            slotSelect.innerHTML = '<option value="">Loading availability...</option>';
            fetch(`/api/availability/${selectedDate}?sport=${sport.toLowerCase()}&location_id=${locId}`)
                .then(res => res.json())
                .then(availability => {
                    slotSelect.innerHTML = '<option value="">Select Time Slot</option>';
                    const availMap = {};
                    if (Array.isArray(availability)) {
                        availability.forEach(item => {
                            availMap[item._id] = item;
                        });
                    }
                    filtered.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        const statusInfo = availMap[s.id];
                        const price = statusInfo ? statusInfo.price : s.price;
                        const discountInfo = (statusInfo && statusInfo.discount_active) ? ` (${statusInfo.discount_percent}% OFF)` : '';
                        
                        if (statusInfo && (statusInfo.is_booked || statusInfo.is_pending)) {
                            const statusLabel = statusInfo.is_booked ? 'Booked' : 'Pending';
                            opt.textContent = `${s.time} - ৳${price}${discountInfo} (${statusLabel})`;
                            opt.disabled = true;
                            opt.style.color = '#888';
                        } else {
                            opt.textContent = `${s.time} - ৳${price}${discountInfo}`;
                        }
                        slotSelect.appendChild(opt);
                    });
                })
                .catch(err => {
                    console.error('Error fetching availability:', err);
                    slotSelect.innerHTML = '<option value="">Select Time Slot</option>';
                    filtered.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.textContent = `${s.time} - ৳${s.price}`;
                        slotSelect.appendChild(opt);
                    });
                });
        } else {
            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.time} - ৳${s.price}`;
                slotSelect.appendChild(opt);
            });
        }
    }

    // Auto-filter slots on load if location is already set (e.g. for branch admins)
    document.addEventListener('DOMContentLoaded', function() {
        const locEl = document.getElementById('location_id');
        if (locEl && locEl.value) {
            filterSlots(locEl.value, currentSport);
        }
    });
</script>
{% endblock %}
